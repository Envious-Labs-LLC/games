name: ci

# Per-game CI. Discovers every game under games/ with a package.json and runs
# the full check suite for each. No games => empty matrix => no-op (still green).
#
# DORMANT DURING CRAWL (founder call 2026-07-26). Manual-only: automatic push and
# pull_request triggers are off. The games under games/ are exploratory prototypes
# and throwaway test artifacts, not production code, so a red build here signals
# nothing worth acting on and just burns Actions minutes. This matches
# `.claude/rules/workflow-process.md` RULE: stay-in-stage, which puts CI at Walk.
#
# To turn back on at Walk stage, restore:
#   on:
#     push:
#       branches: [main]
#     pull_request:
# Before doing so, know that hanuman-wind-lab's Playwright suite fails 6/8 on
# Linux (passes on macOS) and has never once run green in CI. See
# `.claude/knowledge/walk/github-and-ci.md`.

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      games: ${{ steps.find.outputs.games }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          games=$(find games -maxdepth 2 -name package.json -printf '%h\n' 2>/dev/null \
            | sed 's#^games/##' | jq -R . | jq -cs .)
          [ "$games" = "null" ] && games='[]'
          echo "games=$games" >> "$GITHUB_OUTPUT"
          echo "Discovered games: $games"

  check:
    needs: discover
    if: needs.discover.outputs.games != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        game: ${{ fromJSON(needs.discover.outputs.games) }}
    defaults:
      run:
        working-directory: games/${{ matrix.game }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      # `defaults.run.working-directory` applies only to `run` steps, not to
      # `uses` actions, so this action reads the repo root unless pointed at the
      # game. There is no root package.json, so without this it fails with
      # "No pnpm version is specified". The version itself comes from the game's
      # `packageManager` field, which also pins local runs to the same pnpm.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: games/${{ matrix.game }}/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: games/${{ matrix.game }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm validate:content
      - run: pnpm test
      - run: pnpm test:sim
      - run: pnpm build
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
